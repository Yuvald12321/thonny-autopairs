[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "thonny-autopairs"
version = "1.0.0"
description = "Bracket and quote auto-pairing plugin for Thonny"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Yuvald12321" },
]
keywords = ["thonny", "editor", "auto-pairs", "brackets", "quotes"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Plugins",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Text Editors",
]

[project.urls]
Homepage = "https://github.com/Yuvald12321/thonny-autopairs"
Repository = "https://github.com/Yuvald12321/thonny-autopairs"

[tool.setuptools.packages.find]
include = ["thonnycontrib*"]
namespaces = true

[tool.setuptools.package-data]
thonnycontrib = ["py.typed"]
